<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SA Owner Pending Feedback Portal</title>
<style>
body{margin:0;background:#f4f7fb;font-family:Segoe UI,Arial,sans-serif;color:#101828}.head{background:linear-gradient(135deg,#073b8e,#155eef);color:#fff;text-align:center;padding:22px}.head h1{margin:0;font-size:25px}.wrap{max-width:1150px;margin:18px auto;padding:0 14px}.card{background:#fff;border:1px solid #d9e2ef;border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 8px 22px rgba(16,24,40,.06)}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-weight:800;font-size:14px;display:block;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:12px;font:inherit}textarea{min-height:72px;resize:vertical}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;color:#fff;background:#155eef;cursor:pointer}.btn.green{background:#087443}.btn.red{background:#b42318}.btn.grey{background:#e5e7eb;color:#111827}.hidden{display:none!important}.msg{padding:12px;border-radius:12px;background:#eef6ff;color:#123b7a;font-weight:800;margin-top:12px;white-space:pre-wrap}.msg.err{background:#fef2f2;color:#b42318}.msg.ok{background:#ecfdf5;color:#047857}.summary{display:flex;gap:10px;flex-wrap:wrap}.box{background:#f8fafc;border:1px solid #d9e2ef;border-radius:14px;padding:12px;min-width:140px}.box b{display:block;font-size:26px}.task{border:1px solid #d9e2ef;border-radius:16px;padding:14px;margin:12px 0;background:#fff}.taskHead{display:flex;justify-content:space-between;border-bottom:1px solid #d9e2ef;padding-bottom:10px;margin-bottom:12px;gap:8px;flex-wrap:wrap}.tag{border-radius:999px;background:#eef2ff;color:#1e40af;padding:6px 10px;font-weight:900;font-size:12px}.field{background:#f8fafc;border:1px solid #edf2f7;border-radius:12px;padding:9px}.field small{display:block;color:#667085;font-size:11px}.field span{font-weight:900}.bar{position:sticky;bottom:0;background:rgba(244,247,251,.96);border-top:1px solid #d9e2ef;padding:12px;display:flex;justify-content:center;gap:10px}.title{font-weight:900;font-size:18px;margin:0 0 10px}.oktxt{color:#087443;font-weight:900}.badtxt{color:#b42318;font-weight:900}@media(max-width:820px){.row,.grid3{grid-template-columns:1fr}.bar{display:block}.bar .btn{width:100%;margin:5px 0}.head h1{font-size:22px}}
</style>
</head>
<body>
<div class="head"><h1 id="appTitle">SA Owner Pending Feedback Portal</h1><p>Loads daily tasks from GitHub and submits feedback to Power Automate.</p></div>
<div class="wrap">
  <div class="card"><p class="title">Load Pending Tasks</p><button class="btn" id="refresh">Refresh Pending Tasks</button><div id="loadMsg" class="msg hidden"></div><div class="row" style="margin-top:14px"><div><label>Select SA Owner / RM</label><select id="owner"><option value="">Select your name</option></select></div><div><label>Search</label><input id="search" placeholder="Cluster / HHID / PMAID / WO / Appointment"></div></div></div>
  <div class="card hidden" id="summary"><p class="title" id="ownerTitle">Pending Tasks</p><div class="summary"><div class="box"><small>Total</small><b id="total">0</b></div><div class="box"><small>Filled</small><b id="filled">0</b></div><div class="box"><small>Remaining</small><b id="remain">0</b></div></div></div>
  <div id="tasks"></div>
</div>
<div class="bar hidden" id="bar"><button class="btn grey" id="draftBtn">Save Draft</button><button class="btn green" id="submitBtn">Submit Feedback</button></div>
<script>
let config={},tasks=[],owner='',draft=JSON.parse(localStorage.getItem('sa_pa_draft')||'{}');
const $=id=>document.getElementById(id),norm=v=>String(v??'').trim(),clean=v=>norm(v).replace(/\s+/g,' '),low=v=>clean(v).toLowerCase();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const key=r=>clean(r['Appointment Number'])||clean(r['Work Order Number'])||clean(r['Cluster ID'])+'|'+clean(r.PMAID);
function msg(id,t,cls=''){let e=$(id);e.textContent=t;e.className='msg '+cls;e.classList.remove('hidden')}
async function loadConfig(){try{let r=await fetch('config.json?ts='+Date.now());config=await r.json();$('appTitle').textContent=config.appTitle||'SA Owner Pending Feedback Portal'}catch(e){config={powerAutomateUrl:'PASTE_POWER_AUTOMATE_HTTP_POST_URL_HERE',requireAllTasksBeforeSubmit:true}}}
async function loadTasks(){try{await loadConfig();let res=await fetch('pending_tasks.json?ts='+Date.now());if(!res.ok)throw new Error('pending_tasks.json not found');let data=await res.json();tasks=(Array.isArray(data)?data:[]).filter(x=>clean(x['Feedback Status']||'Pending').toLowerCase()==='pending');populateOwners();msg('loadMsg',`Loaded ${tasks.length} pending tasks.`,tasks.length?'ok':'err')}catch(e){msg('loadMsg','Load failed: '+e.message,'err')}}
function populateOwners(){let map=new Map();tasks.forEach(x=>{let o=clean(x['SA Owner']);if(o&&!map.has(o.toLowerCase()))map.set(o.toLowerCase(),o)});let owners=[...map.values()].sort();$('owner').innerHTML='<option value="">Select your name</option>'+owners.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}
$('refresh').onclick=loadTasks;$('owner').onchange=()=>{owner=$('owner').value;render()};$('search').oninput=render;
function ownerRows(){let q=low($('search').value);return tasks.filter(r=>clean(r['SA Owner'])===clean(owner)).filter(r=>!q||['Cluster ID','HHID','PMAID','Work Order Number','Appointment Number'].some(c=>low(r[c]).includes(q)))}
function render(){if(!owner){$('tasks').innerHTML='';$('summary').classList.add('hidden');$('bar').classList.add('hidden');return}let rows=ownerRows();$('summary').classList.remove('hidden');$('bar').classList.remove('hidden');$('ownerTitle').textContent=owner+' - Pending Tasks';$('tasks').innerHTML=rows.map((r,i)=>{let f=draft[key(r)]||{},ok=clean(f.reason)&&clean(f.date);return `<div class="task" data-key="${esc(key(r))}"><div class="taskHead"><b>Task ${i+1}</b><span class="tag">${esc(r['Task Status']||r.Status||'Pending')}</span></div><div class="grid3"><div class="field"><small>Cluster ID</small><span>${esc(r['Cluster ID'])}</span></div><div class="field"><small>HHID</small><span>${esc(r.HHID)}</span></div><div class="field"><small>PMAID</small><span>${esc(r.PMAID)}</span></div><div class="field"><small>Work Order Number</small><span>${esc(r['Work Order Number'])}</span></div><div class="field"><small>Appointment Number</small><span>${esc(r['Appointment Number'])}</span></div><div class="field"><small>Feedback</small><span class="status ${ok?'oktxt':'badtxt'}">${ok?'Filled':'Pending'}</span></div></div><div class="row" style="margin-top:12px"><div><label>Reason for Pending</label><textarea class="reason">${esc(f.reason||'')}</textarea></div><div><label>By which Date Connect</label><input type="date" class="date" value="${esc(f.date||'')}"></div></div></div>`}).join('');document.querySelectorAll('.reason,.date').forEach(e=>e.onchange=saveDraft);counts()}
function saveDraft(){document.querySelectorAll('.task').forEach(t=>{let reason=t.querySelector('.reason').value.trim(),date=t.querySelector('.date').value.trim();if(reason||date)draft[t.dataset.key]={reason,date};else delete draft[t.dataset.key];let s=t.querySelector('.status'),ok=reason&&date;s.textContent=ok?'Filled':'Pending';s.className='status '+(ok?'oktxt':'badtxt')});localStorage.setItem('sa_pa_draft',JSON.stringify(draft));counts()}
function counts(){let rows=tasks.filter(r=>clean(r['SA Owner'])===clean(owner)),filled=rows.filter(r=>{let f=draft[key(r)]||{};return clean(f.reason)&&clean(f.date)}).length;$('total').textContent=rows.length;$('filled').textContent=filled;$('remain').textContent=rows.length-filled}
$('draftBtn').onclick=()=>{saveDraft();alert('Draft saved in this browser.')};
$('submitBtn').onclick=async()=>{try{saveDraft();if(!config.powerAutomateUrl||config.powerAutomateUrl.includes('PASTE_POWER_AUTOMATE')){alert('Power Automate URL is not configured in config.json.');return}let rows=tasks.filter(r=>clean(r['SA Owner'])===clean(owner));let missing=rows.filter(r=>{let f=draft[key(r)]||{};return !(clean(f.reason)&&clean(f.date))});if((config.requireAllTasksBeforeSubmit!==false)&&missing.length){alert('Fill all tasks before submit. Remaining: '+missing.length);return}let feedbackRows=rows.filter(r=>{let f=draft[key(r)]||{};return clean(f.reason)&&clean(f.date)}).map(r=>{let f=draft[key(r)]||{};return {'Cluster ID':clean(r['Cluster ID']),'HHID':clean(r.HHID),'PMAID':clean(r.PMAID),'Work Order Number':clean(r['Work Order Number']),'SA Owner':clean(r['SA Owner']),'Appointment Number':clean(r['Appointment Number']),'Reason for Pending':f.reason,'By which Date Connect':f.date,'Submitted Time':new Date().toISOString(),'Batch Date':clean(r['Batch Date']||''),'Task Status':clean(r['Task Status']||r.Status||'')}});let payload={source:'github-pages-sa-feedback',saOwner:owner,submittedAt:new Date().toISOString(),rows:feedbackRows};let res=await fetch(config.powerAutomateUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload)});if(!res.ok){throw new Error('Power Automate returned HTTP '+res.status)}feedbackRows.forEach(r=>delete draft[r['Appointment Number']]);localStorage.setItem('sa_pa_draft',JSON.stringify(draft));alert('Feedback submitted successfully.');}catch(e){alert('Submit failed: '+e.message+'\nCheck Power Automate flow URL and flow run history.')}};
loadTasks();
</script>
</body>
</html>
